name: Measure

on:
  workflow_dispatch:
  pull_request:
    paths:
      - scripts/**
      - envs/**
      - tests/**
      - .github/workflows/measure.yml

permissions:
  contents: read

concurrency:
  group: measure-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Rules tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.1.0
        with:
          version: "0.13.4"
      - run: uv run --no-project --python 3.13 --with pytest --with hypothesis pytest tests -q

  measure:
    name: Measure (${{ matrix.env }})
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        env: [pinned, head]
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.1.0
        with:
          version: "0.13.4"
      - name: Build the environment
        run: |
          uv venv --python 3.13 .venv
          uv pip install --python .venv/bin/python -r envs/${{ matrix.env }}.txt
          mkdir -p results/${{ matrix.env }}
          uv pip freeze --python .venv/bin/python > results/${{ matrix.env }}/freeze.txt
          cat results/${{ matrix.env }}/freeze.txt
      - name: Measure
        run: .venv/bin/python scripts/measure.py --label ${{ matrix.env }} --out results/${{ matrix.env }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: results-${{ matrix.env }}
          path: results/${{ matrix.env }}
          if-no-files-found: error

  compare:
    name: Compare
    needs: measure
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: results-pinned
          path: results/pinned
      - uses: actions/download-artifact@v8
        with:
          name: results-head
          path: results/head
      - name: Compare
        run: python3 scripts/compare.py results/pinned results/head --out results >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: results-comparison
          path: |
            results/comparison.json
            results/comparison.csv
            results/comparison.md
